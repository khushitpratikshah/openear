<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#33414d"/></marker></defs><rect width="1600" height="1080" fill="#fff"/><text x="45" y="50" font-size="30" fill="#16212b" text-anchor="start" font-weight="700">OpenEar: audio signal flow and software structure</text><text x="45" y="80" font-size="16" fill="#56636e" text-anchor="start" font-weight="400">MAX32655FTHR, 48 kHz, 64-sample blocks (1.33 ms). The DSP runs inside the receive DMA interrupt, so the main loop cannot disturb the audio.</text><text x="45" y="128" font-size="15" fill="#1f6f5c" text-anchor="start" font-weight="700">AUDIO PATH (real time). Green = hardware, orange = DSP code in the interrupt.</text><rect x="45" y="145" width="270" height="96" rx="10" fill="#eef6f3" stroke="#2f7d68" stroke-width="2"/><text x="180.0" y="188.0" font-size="18" font-weight="700" fill="#16212b" text-anchor="middle">On-board mic</text><text x="180.0" y="212.0" font-size="14" fill="#56636e" text-anchor="middle">powered by PMIC LDO1</text><rect x="355" y="145" width="270" height="96" rx="10" fill="#eef6f3" stroke="#2f7d68" stroke-width="2"/><text x="490.0" y="188.0" font-size="18" font-weight="700" fill="#16212b" text-anchor="middle">MAX9867 codec</text><text x="490.0" y="212.0" font-size="14" fill="#56636e" text-anchor="middle">ADC, I2S clock master</text><rect x="665" y="145" width="270" height="96" rx="10" fill="#eef6f3" stroke="#2f7d68" stroke-width="2"/><text x="800.0" y="188.0" font-size="18" font-weight="700" fill="#16212b" text-anchor="middle">I2S RX + DMA</text><text x="800.0" y="212.0" font-size="14" fill="#56636e" text-anchor="middle">ping-pong buffers</text><rect x="975" y="145" width="270" height="96" rx="10" fill="#fff4e3" stroke="#b9722a" stroke-width="2"/><text x="1110.0" y="188.0" font-size="18" font-weight="700" fill="#16212b" text-anchor="middle">Float conversion</text><text x="1110.0" y="212.0" font-size="14" fill="#56636e" text-anchor="middle">int16 to float</text><rect x="1285" y="145" width="270" height="96" rx="10" fill="#fff4e3" stroke="#b9722a" stroke-width="2"/><text x="1420.0" y="177.0" font-size="18" font-weight="700" fill="#16212b" text-anchor="middle">6-band split</text><text x="1420.0" y="201.0" font-size="14" fill="#56636e" text-anchor="middle">Linkwitz-Riley</text><text x="1420.0" y="220.0" font-size="14" fill="#56636e" text-anchor="middle">250 / 500 / 1k / 2k / 4k Hz</text><path d="M315 193.0 L353 193.0" fill="none" stroke="#33414d" stroke-width="2.5" marker-end="url(#a)"/><path d="M625 193.0 L663 193.0" fill="none" stroke="#33414d" stroke-width="2.5" marker-end="url(#a)"/><path d="M935 193.0 L973 193.0" fill="none" stroke="#33414d" stroke-width="2.5" marker-end="url(#a)"/><path d="M1245 193.0 L1283 193.0" fill="none" stroke="#33414d" stroke-width="2.5" marker-end="url(#a)"/><path d="M1420.0 241 L1420.0 288 L180.0 288 L180.0 333" fill="none" stroke="#33414d" stroke-width="2.5" marker-end="url(#a)"/><text x="800" y="280" font-size="13" fill="#56636e" text-anchor="middle" font-weight="400">signal continues on the next row</text><rect x="45" y="335" width="270" height="110" rx="10" fill="#fff4e3" stroke="#b9722a" stroke-width="2"/><text x="180.0" y="374.0" font-size="18" font-weight="700" fill="#16212b" text-anchor="middle">Per-band processing</text><text x="180.0" y="398.0" font-size="14" fill="#56636e" text-anchor="middle">noise gate, compression,</text><text x="180.0" y="417.0" font-size="14" fill="#56636e" text-anchor="middle">gain per band (max +30 dB)</text><rect x="355" y="335" width="270" height="110" rx="10" fill="#fff4e3" stroke="#b9722a" stroke-width="2"/><text x="490.0" y="374.0" font-size="18" font-weight="700" fill="#16212b" text-anchor="middle">Sum + master gain</text><text x="490.0" y="398.0" font-size="14" fill="#56636e" text-anchor="middle">then peak limiter</text><text x="490.0" y="417.0" font-size="14" fill="#56636e" text-anchor="middle">ceiling -6 dBFS (hard cap -3)</text><rect x="665" y="335" width="270" height="110" rx="10" fill="#eef6f3" stroke="#2f7d68" stroke-width="2"/><text x="800.0" y="385.0" font-size="18" font-weight="700" fill="#16212b" text-anchor="middle">I2S TX + DMA</text><text x="800.0" y="409.0" font-size="14" fill="#56636e" text-anchor="middle">ping-pong buffers</text><rect x="975" y="335" width="270" height="110" rx="10" fill="#eef6f3" stroke="#2f7d68" stroke-width="2"/><text x="1110.0" y="385.0" font-size="18" font-weight="700" fill="#16212b" text-anchor="middle">Codec DAC</text><text x="1110.0" y="409.0" font-size="14" fill="#56636e" text-anchor="middle">headphone output</text><rect x="1285" y="335" width="270" height="110" rx="10" fill="#eef6f3" stroke="#2f7d68" stroke-width="2"/><text x="1420.0" y="385.0" font-size="18" font-weight="700" fill="#16212b" text-anchor="middle">Earphone</text><text x="1420.0" y="409.0" font-size="14" fill="#56636e" text-anchor="middle">wired, closed in-ear</text><path d="M315 390.0 L353 390.0" fill="none" stroke="#33414d" stroke-width="2.5" marker-end="url(#a)"/><path d="M625 390.0 L663 390.0" fill="none" stroke="#33414d" stroke-width="2.5" marker-end="url(#a)"/><path d="M935 390.0 L973 390.0" fill="none" stroke="#33414d" stroke-width="2.5" marker-end="url(#a)"/><path d="M1245 390.0 L1283 390.0" fill="none" stroke="#33414d" stroke-width="2.5" marker-end="url(#a)"/><text x="975" y="478" font-size="13" fill="#56636e" text-anchor="start" font-weight="400">Howl guard: sustained limiting with a quiet input lowers master gain in 3 dB steps.</text><text x="975" y="498" font-size="13" fill="#56636e" text-anchor="start" font-weight="400">Test tone (max -20 dBFS, 10 ms fades, auto-stop 15 s) replaces the mic path.</text><text x="45" y="560" font-size="15" fill="#3b5fa6" text-anchor="start" font-weight="700">CONTROL (main loop, never touches the audio)</text><rect x="45" y="578" width="270" height="92" rx="10" fill="#eef2fb" stroke="#3b5fa6" stroke-width="2"/><text x="180.0" y="608.0" font-size="18" font-weight="700" fill="#16212b" text-anchor="middle">Phone web app</text><text x="180.0" y="632.0" font-size="14" fill="#56636e" text-anchor="middle">Web Bluetooth: hearing test,</text><text x="180.0" y="651.0" font-size="14" fill="#56636e" text-anchor="middle">fit, live sliders and levels</text><rect x="355" y="578" width="270" height="92" rx="10" fill="#eef2fb" stroke="#3b5fa6" stroke-width="2"/><text x="490.0" y="619.0" font-size="18" font-weight="700" fill="#16212b" text-anchor="middle">Bluetooth LE (Cordio)</text><text x="490.0" y="643.0" font-size="14" fill="#56636e" text-anchor="middle">one text line in, one line out</text><rect x="665" y="578" width="270" height="92" rx="10" fill="#eef2fb" stroke="#3b5fa6" stroke-width="2"/><text x="800.0" y="608.0" font-size="18" font-weight="700" fill="#16212b" text-anchor="middle">Command parser</text><text x="800.0" y="632.0" font-size="14" fill="#56636e" text-anchor="middle">safety caps: bad numbers</text><text x="800.0" y="651.0" font-size="14" fill="#56636e" text-anchor="middle">fall to the quiet end</text><rect x="975" y="578" width="270" height="92" rx="10" fill="#eef2fb" stroke="#3b5fa6" stroke-width="2"/><text x="1110.0" y="619.0" font-size="18" font-weight="700" fill="#16212b" text-anchor="middle">Profile in flash</text><text x="1110.0" y="643.0" font-size="14" fill="#56636e" text-anchor="middle">fit, save, load at boot</text><path d="M315 624 L353 624" fill="none" stroke="#33414d" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/><path d="M625 624 L663 624" fill="none" stroke="#33414d" stroke-width="2.5" marker-end="url(#a)"/><path d="M935 624 L973 624" fill="none" stroke="#33414d" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/><rect x="355" y="712" width="270" height="84" rx="10" fill="#eef2fb" stroke="#3b5fa6" stroke-width="2"/><text x="490.0" y="738.0" font-size="18" font-weight="700" fill="#16212b" text-anchor="middle">Buttons + LEDs</text><text x="490.0" y="762.0" font-size="14" fill="#56636e" text-anchor="middle">SW2 bypass, SW3 volume,</text><text x="490.0" y="781.0" font-size="14" fill="#56636e" text-anchor="middle">SW3 hold records</text><rect x="665" y="712" width="270" height="84" rx="10" fill="#eef2fb" stroke="#3b5fa6" stroke-width="2"/><text x="800.0" y="738.0" font-size="18" font-weight="700" fill="#16212b" text-anchor="middle">Console (USB serial)</text><text x="800.0" y="762.0" font-size="14" fill="#56636e" text-anchor="middle">stat, raw, show, tone,</text><text x="800.0" y="781.0" font-size="14" fill="#56636e" text-anchor="middle">i2cscan, batt</text><rect x="975" y="712" width="270" height="84" rx="10" fill="#eef2fb" stroke="#3b5fa6" stroke-width="2"/><text x="1110.0" y="738.0" font-size="18" font-weight="700" fill="#16212b" text-anchor="middle">SD recorder</text><text x="1110.0" y="762.0" font-size="14" fill="#56636e" text-anchor="middle">raw mic + output,</text><text x="1110.0" y="781.0" font-size="14" fill="#56636e" text-anchor="middle">one stereo file</text><path d="M800.0 710 L800.0 672" fill="none" stroke="#33414d" stroke-width="2.5" marker-end="url(#a)"/><path d="M565 710 L725 672" fill="none" stroke="#33414d" stroke-width="2.5" marker-end="url(#a)"/><path d="M705 576 L705 530 L490.0 530 L490.0 447" fill="none" stroke="#3b5fa6" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="7 5"/><text x="500.0" y="524" font-size="13" fill="#3b5fa6" text-anchor="start" font-weight="400">new settings, applied at the next block</text><rect x="45" y="850" width="580" height="130" rx="10" fill="#f4effa" stroke="#7b5aa6" stroke-width="2"/><text x="65" y="880" font-size="14" fill="#5e3f8c" text-anchor="start" font-weight="700">SHARED I2C1 BUS (one owner, started once, 100 kHz)</text><text x="70" y="922" font-size="16" fill="#16212b" text-anchor="start" font-weight="700">Codec 0x18</text><text x="70" y="946" font-size="14" fill="#56636e" text-anchor="start" font-weight="400">volume, sidetone</text><text x="260" y="922" font-size="16" fill="#16212b" text-anchor="start" font-weight="700">PMIC 0x28</text><text x="260" y="946" font-size="14" fill="#56636e" text-anchor="start" font-weight="400">mic power</text><text x="430" y="922" font-size="16" fill="#16212b" text-anchor="start" font-weight="700">Fuel gauge 0x36</text><text x="430" y="946" font-size="14" fill="#56636e" text-anchor="start" font-weight="400">battery level</text><rect x="665" y="850" width="890" height="130" rx="10" fill="#fdf0f0" stroke="#b34a4a" stroke-width="2"/><text x="685" y="880" font-size="14" fill="#963030" text-anchor="start" font-weight="700">HARD SAFETY LIMITS (in the audio code, not just the app)</text><text x="685" y="912" font-size="15" fill="#16212b" text-anchor="start" font-weight="400">Band gain stops at +30 dB</text><text x="685" y="940" font-size="15" fill="#16212b" text-anchor="start" font-weight="400">Output never above -3 dBFS</text><text x="685" y="968" font-size="15" fill="#16212b" text-anchor="start" font-weight="400">Test tones never above -20 dBFS</text><text x="1005" y="912" font-size="15" fill="#16212b" text-anchor="start" font-weight="400">Master gain limited to -60 .. +12 dB</text><text x="1005" y="940" font-size="15" fill="#16212b" text-anchor="start" font-weight="400">Codec starts muted, shuts down on a fault</text><text x="1005" y="968" font-size="15" fill="#16212b" text-anchor="start" font-weight="400">Invalid numbers fall to the quiet end</text><text x="45" y="1018" font-size="15" fill="#56636e" text-anchor="start" font-weight="400">Latency by design: about 3.3 ms of buffering + about 1 ms of filter delay + codec. End-to-end latency on the board is still to be measured.</text><text x="45" y="1044" font-size="15" fill="#56636e" text-anchor="start" font-weight="400">OpenEar is an assistive-listening experiment, not a medical device. Open source, MIT licence.</text></svg>